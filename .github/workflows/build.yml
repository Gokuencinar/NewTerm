name: NewTerm 3 RootHide experimental

on:
  push:
    paths-ignore:
      - '.gitignore'
      - '**/.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Procursus
      uses: beerpiss/procursus-action@v2
      with:
        packages: ldid xz-utils cmark make
        cache: true
        cache-path: ~/__cache
    - name: Set up Theos
      run: git clone --recursive --depth=1 'https://github.com/theos/theos.git' ~/theos
    - name: Compile
      id: package_build
      run: |
        gmake package ROOTHIDE=1 THEOS=~/theos
        echo "package=$(cat .theos/last_package)" >> $GITHUB_OUTPUT
    - name: Verify RootHide package
      run: |
        test -f "${{ steps.package_build.outputs.package }}"
        test "$(dpkg-deb -f '${{ steps.package_build.outputs.package }}' Package)" = 'ws.hbang.newterm3'
        test "$(dpkg-deb -f '${{ steps.package_build.outputs.package }}' Architecture)" = 'iphoneos-arm64e'
        shasum -a 256 '${{ steps.package_build.outputs.package }}'
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NewTerm3-RootHide-deadlock-fix
        path: '${{ steps.package_build.outputs.package }}'
        if-no-files-found: error
